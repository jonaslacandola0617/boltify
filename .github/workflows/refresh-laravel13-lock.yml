name: Validate Laravel 13 Upgrade

on:
  push:
    branches:
      - agent/finish-boltify-admin
    paths:
      - composer.json
      - composer.lock
      - .github/workflows/refresh-laravel13-lock.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/finish-boltify-admin

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Resolve Laravel 13 dependencies
        run: composer update --with-all-dependencies --no-interaction --prefer-dist

      - name: Audit PHP dependencies
        run: composer audit

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan optimize:clear
          php artisan --version

      - name: Run Laravel tests
        run: php artisan test

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "refresh Composer lock for Laravel 13"
            git push origin HEAD:agent/finish-boltify-admin
          fi
